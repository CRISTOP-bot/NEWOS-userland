name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c-syntax:
    name: Freestanding C syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Syntax-check libc units and its self-test source
        run: >-
          gcc -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror
          -fsyntax-only -Ilibc/include
          libc/src/errno.c
          libc/src/malloc.c
          libc/src/signal.c
          libc/src/string.c
          libc/src/termios.c
          user/programs/ltest/ltest_main.c
